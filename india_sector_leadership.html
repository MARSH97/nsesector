<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>India Sector & Theme Leadership</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--panel:#121214;--line:#1f1f23;--text:#ececea;--mute:#7d7d85;--o:#ffb454;--c:#5ec8e5;--p:#ff6b8b;--g:#6ee7a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1500px;margin:auto;padding:40px 40px 64px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:44px}
h1{margin:0 auto 0 0;font-size:18px;font-weight:600;letter-spacing:-.02em}
h1:after{content:" NSE";color:var(--mute);font-weight:400}
#views{display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
select,button.t{height:30px;border:0;border-radius:7px;padding:0 14px;background:transparent;color:var(--mute);font:500 13px inherit;font-family:inherit;cursor:pointer;transition:.15s}
button.t:hover{color:var(--text)}button.t.on{background:#26262b;color:var(--text)}
select{background:var(--panel);border:1px solid var(--line);color:var(--text);height:36px;border-radius:10px;padding:0 12px;outline:none}
h2{margin:56px 0 18px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
h2:first-of-type{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}
@media(max-width:1300px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:20px 16px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0;overflow-x:auto}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:13px;font-weight:600;color:var(--text)}
.card h3:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--k)}
.card h4{margin:22px 0 4px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
th{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}td:first-child{font-weight:600;color:var(--mute)}
td:nth-child(2){font-weight:550}
tr.r{cursor:pointer;transition:background .12s}tr.r:hover{background:#18181b}
.pos{color:var(--g)}.neg{color:var(--p)}
.wide{max-width:900px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px}
.row{display:grid;grid-template-columns:minmax(120px,220px) 1fr 70px;gap:16px;align-items:center;min-height:30px;cursor:pointer;transition:background .12s}
.row:hover{background:#18181b}
.trk{position:relative;height:6px;background:#17171a;border-radius:3px}
.trk:before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid #2c2c31}
.bb{position:absolute;top:0;height:6px;border-radius:3px}
.val{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
svg{width:100%;height:200px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(720px,94vw)}
dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}
.note{max-width:900px;margin:40px 0 0;font-size:11px;line-height:1.7;color:var(--mute)}
</style></head><body><main>
<div class="bar"><h1>India Leadership</h1><div id="views"></div><select id="date"></select></div>
<h2 id="t1"></h2><div class="grid" id="lead"></div>
<h2>Non-extended leaders</h2><div class="grid" id="nel"></div>
<h2>1-day change</h2><div class="wide"><div id="chg"></div></div>
<p class="note">Strength = 100×(N−rank+1)/N by median performance. Windows: 1m=21, 3m=63, 6m=126, 1y=252 trading days. Extension = (Close − SMA50) ÷ ATR14; NEL = extension ≤ 4. Data: Yahoo Finance via fetch_india_data.py.</p>
<dialog id="dlg"></dialog></main>
<script src="india_data.js"></script>
<script>
const F={'1m':21,'3m':63,'6m':126,'1y':252},K={'1m':'--o','3m':'--c','6m':'--p','1y':'--g'},LB={'1m':'1 month','3m':'3 months','6m':'6 months','1y':'1 year'};
const PAL=['#E9C46A','#5C7CFA','#E76F51','#C77DFF','#70C1B3','#4CC9F0','#F4A261','#D77AAB','#80ED99','#FF6B6B','#B8DE6F','#9D8DF1','#F28482','#84A59D'];
const D=DATA,$=id=>document.getElementById(id),S=s=>D.series[s];
let view=Object.keys(D.views)[0],mode='groups';
const nm=s=>s.replace('.NS','').replace('^','');
const perf=(s,i,n)=>{const c=S(s).c;return i>=n&&c[i]&&c[i-n]?(c[i]/c[i-n]-1)*100:null};
const med=a=>{a=[...a].sort((x,y)=>x-y);const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const adr=(s,i)=>{const{h,l}=S(s);let t=0,k=0;for(let j=i-19;j<=i;j++)if(j>=0&&h[j]&&l[j]){t+=(h[j]/l[j]-1)*100;k++}return k?t/k:null};
const ext=(s,i)=>{const{c,h,l}=S(s);if(i<51||!c[i])return null;let m=0,a=0;for(let j=i-49;j<=i;j++)m+=c[j]||0;m/=50;
 for(let j=i-13;j<=i;j++)a+=Math.max(h[j]-l[j],Math.abs(h[j]-c[j-1]),Math.abs(l[j]-c[j-1]));a/=14;return a?(c[i]-m)/a:null};
const f=(v,d=1,u='')=>v==null||isNaN(v)?'—':v.toFixed(d)+u,cl=v=>v>=0?'pos':'neg';
const col=g=>PAL[Object.keys(D.views[view]).indexOf(g)%PAL.length];
function rank(i,fr){const rows=Object.entries(D.views[view]).map(([g,ms])=>{
  const pr=ms.map(s=>[s,perf(s,i,F[fr])]).filter(x=>x[1]!=null);if(!pr.length)return null;
  pr.sort((a,b)=>b[1]-a[1]);return{g,ms,med:med(pr.map(x=>x[1])),lead:pr[0][0],conf:pr.filter(x=>x[1]>0).length,n:ms.length}}).filter(Boolean)
  .sort((a,b)=>b.med-a.med);rows.forEach((r,k)=>r.score=100*(rows.length-k)/rows.length);return rows}
function render(){const i=+$('date').value,top=3;
 $('t1').textContent=`${view} Leaders - ${Object.keys(D.views[view]).length} Groups`;
 $('lead').innerHTML=Object.keys(F).map(fr=>{const rows=rank(i,fr).slice(0,top);
  return `<section class="card" style="--k:var(${K[fr]})"><h3>${LB[fr]} top ${top}</h3><table><thead><tr><th>#</th><th>Group</th><th>Strength</th><th>Median</th><th>Leader</th><th>Conf.</th></tr></thead><tbody>${
  rows.map((r,k)=>`<tr class="r" data-g="${r.g}"><td>${k+1}</td><td style="color:${col(r.g)}">${r.g}</td><td>${f(r.score)}</td><td class="${cl(r.med)}">${f(r.med,1,'%')}</td><td>${nm(r.lead)}</td><td>${r.conf}/${r.n}</td></tr>`).join('')}</tbody></table><h4>Leadership over time</h4><svg id="tr${fr}"></svg></section>`}).join('');
 Object.keys(F).forEach(fr=>trend(fr,i));
 $('nel').innerHTML=Object.keys(F).map(fr=>{const rows=[];Object.entries(D.views[view]).forEach(([g,ms])=>ms.forEach(s=>{const e=ext(s,i),p=perf(s,i,F[fr]);if(e!=null&&e<=4&&p!=null)rows.push({s,g,p,e,a:adr(s,i)})}));
  rows.sort((a,b)=>b.p-a.p);
  return `<section class="card" style="--k:var(${K[fr]})"><h3>${LB[fr]} NEL (${rows.length})</h3><table><thead><tr><th>Symbol</th><th>Group</th><th>Perf</th><th>ADR</th><th>Ext</th></tr></thead><tbody>${
  rows.slice(0,25).map(r=>`<tr class="r" data-g="${r.g}"><td>${nm(r.s)}</td><td>${r.g}</td><td class="${cl(r.p)}">${f(r.p,1,'%')}</td><td>${f(r.a,1,'%')}</td><td>${f(r.e,1,'×')}</td></tr>`).join('')||'<tr><td colspan=5>None qualifying</td></tr>'}</tbody></table></section>`}).join('');
 chg(i)}
function trend(fr,i){const svg=$('tr'+fr),names=rank(i,fr).slice(0,5).map(r=>r.g),a=[];for(let j=Math.max(0,i-29);j<=i;j++)a.push(j);
 const W=520,H=240,L=30,R=10,T=10,B=24,x=k=>L+k*(W-L-R)/Math.max(1,a.length-1),y=v=>T+(100-v)*(H-T-B)/100;
 let m=[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1f1f23"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#7d7d85">${v}</text>`).join('');
 const sc=a.map(j=>rank(j,fr));
 names.forEach(g=>{const p=sc.map((r,k)=>{const q=r.find(z=>z.g===g);return q?`${x(k)},${y(q.score)}`:null}).filter(Boolean).join(' ');m+=`<polyline points="${p}" fill="none" stroke="${col(g)}" stroke-width="1.8"><title>${g}</title></polyline>`});
 [0,a.length-1].forEach(k=>m+=`<text x="${x(k)}" y="${H-6}" font-size="10" text-anchor="${k?'end':'start'}" fill="#7d7d85">${D.dates[a[k]].slice(5)}</text>`);
 svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=m}
function chg(i){const rows=mode==='groups'?Object.entries(D.views[view]).map(([g,ms])=>({k:g,v:med(ms.map(s=>perf(s,i,1)).filter(v=>v!=null)),g})):
  Object.entries(D.views[view]).flatMap(([g,ms])=>ms.map(s=>({k:nm(s),v:perf(s,i,1),g})));
 rows.sort((a,b)=>(b.v??-1e9)-(a.v??-1e9));const mx=Math.max(.1,...rows.map(r=>Math.abs(r.v||0)));
 $('chg').innerHTML=rows.map(r=>`<div class="row" data-g="${r.g}"><span><b>${r.k}</b>${mode==='groups'?'':` <small style="opacity:.7">${r.g}</small>`}</span><div class="trk">${r.v==null?'':`<span class="bb" style="background:${r.v>=0?'var(--g)':'var(--p)'};${r.v>=0?'left:50%':'right:50%'};width:${Math.abs(r.v)/mx*50}%"></span>`}</div><span class="val ${cl(r.v)}">${f(r.v,2,'%')}</span></div>`).join('')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-g]');if(!t)return;const i=+$('date').value,ms=D.views[view][t.dataset.g];if(!ms)return;
 $('dlg').innerHTML=`<h3 style="margin-top:0;color:${col(t.dataset.g)}">${t.dataset.g}</h3><table><thead><tr><th>Symbol</th><th></th><th>1d</th><th>1m</th><th>3m</th><th>6m</th><th>1y</th><th>Ext</th></tr></thead><tbody>${
 ms.map(s=>`<tr><td>${nm(s)}</td><td></td>${[1,21,63,126,252].map(n=>{const p=perf(s,i,n);return `<td class="${cl(p)}">${f(p,1,'%')}</td>`}).join('')}<td>${f(ext(s,i),1,'×')}</td></tr>`).join('')}</tbody></table><p><button class="t" onclick="dlg.close()">Close</button></p>`;$('dlg').showModal()});
$('views').innerHTML=Object.keys(D.views).map(v=>`<button class="t${v===view?' on':''}" data-v="${v}">${v}</button>`).join('')+`<button class="t" id="mode">Chart: groups</button>`;
$('views').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='mode'){mode=mode==='groups'?'members':'groups';b.textContent='Chart: '+mode}else{view=b.dataset.v;[...$('views').children].forEach(c=>c.classList.toggle('on',c.dataset.v===view))}render()};
$('date').innerHTML=[...D.dates.keys()].reverse().map(i=>`<option value="${i}">${D.dates[i]}</option>`).join('');
$('date').value=D.dates.length-1;$('date').onchange=render;render();
</script></body></html>
